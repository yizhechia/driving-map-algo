name: MVP checks
on:
  push:
    branches: [main, "mvp/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile and run concept tests
        run: |
          python -m compileall -q commute_map tests scripts
          python -m unittest discover -s tests -v
          node --check commute_map/static/app.js
          python -m commute_map demo --size 64 --output outputs/demo.json
          python -m commute_map export --output outputs/region.geojson
      - name: Install browser test dependency
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Browser interaction checks
        run: node scripts/browser_smoke.cjs
      - name: Algorithm comparison
        run: python -m scripts.evaluate
      - name: Package installation check
        run: |
          python -m pip install --no-deps .
          cd /tmp
          commute-map demo --size 16 --output /tmp/commute-package-check.json
      - name: Save verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvp-verification
          path: |
            browser-artifacts/
            outputs/
            docs/evaluation/results.json
            docs/evaluation/MVP_RESULTS.md
