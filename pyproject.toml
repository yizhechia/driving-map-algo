[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commute-map-lab"
version = "0.1.0"
description = "A reproducible directed-network commute accessibility experiment"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
commute-map = "commute_map.__main__:main"

[tool.setuptools.packages.find]
include = ["commute_map*"]

[tool.setuptools.package-data]
commute_map = ["static/*"]
